name: Source Automation Guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      author_login:
        description: "Actor login to exercise in the synthetic guard run."
        required: true
        default: "dependabot[bot]"
        type: string

# Metadata-only guard: no checkout, named secrets, or write access.
permissions:
  contents: read
  pull-requests: read

jobs:
  reject-routine-bot-pr:
    if: >-
      github.repository == 'EffortlessMetrics/shiplog' &&
      (github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate source-side routine automation
        env:
          PR_AUTHOR: ${{ github.event_name == 'workflow_dispatch' && inputs.author_login || github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && 'synthetic' || github.event.pull_request.number }}
        run: |
          case "$PR_AUTHOR" in
            'dependabot[bot]'|'factory-droid[bot]')
              echo "Source repository rejects routine bot PR #${PR_NUMBER} from ${PR_AUTHOR}."
              echo "Create the product change in EffortlessMetrics/shiplog-swarm and promote it through the regular source merge checkpoint."
              exit 1
              ;;
            *)
              echo "Source automation guard allows non-routine author ${PR_AUTHOR}."
              ;;
          esac
